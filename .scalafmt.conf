version = "3.11.5"
runner.dialect = scala3

# A middle ground: compact enough for review, spacious enough for Scala types.
maxColumn = 100

# Stable, readable layout for calls, definitions, and match cases.
align.preset = most
align.multiline = false
continuationIndent.defnSite = 2
danglingParentheses.preset = true
newlines.alwaysBeforeMultilineDef = false

# Keeps fluent/select chains less visually noisy.
includeCurlyBraceInSelectChains = false

# Usually desirable in cross-platform repositories.
lineEndings = preserve

# Treat stripMargin strings as standard-library strings when formatting.
assumeStandardLibraryStripMargin = true